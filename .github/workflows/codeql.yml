name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '41 3 * * 2'
  workflow_dispatch:
  workflow_call:
    inputs:
      blocking:
        description: Fail when CodeQL has open high or critical alerts on this ref
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
          config: |
            paths-ignore:
              - '**/dist/**'
              - 'functions/lib/**'
              - 'pnpm-lock.yaml'
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: /language:${{ matrix.language }}

  gate:
    if: ${{ inputs.blocking }}
    needs: analyze
    runs-on: ubuntu-latest
    permissions:
      security-events: read
    steps:
      - name: Fail on open high or critical CodeQL alerts
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: |
          alerts="$(gh api --method GET "repos/$REPO/code-scanning/alerts" --paginate \
            --raw-field tool_name=CodeQL --raw-field state=open --raw-field ref="$REF" --raw-field per_page=100 \
            --jq '.[] | select(.rule.security_severity_level == "high" or .rule.security_severity_level == "critical") | "\(.rule.security_severity_level) \(.rule.id) \(.most_recent_instance.location.path):\(.most_recent_instance.location.start_line) \(.html_url)"')"
          if [ -n "$alerts" ]; then
            echo "Open high or critical CodeQL alerts on $REF:" >&2
            echo "$alerts" >&2
            exit 1
          fi
          echo "No open high or critical CodeQL alerts on $REF."
