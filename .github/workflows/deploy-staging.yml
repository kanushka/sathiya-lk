name: Deploy staging
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse refs other than main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Staging deploys run only from main (got $GITHUB_REF)." >&2
            exit 1
          fi

  ci:
    needs: guard
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/ci.yml

  trivy:
    needs: guard
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/trivy.yml
    with:
      blocking: true

  codeql:
    needs: guard
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/codeql.yml
    with:
      blocking: true

  deploy:
    needs: [guard, ci, trivy, codeql]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 9
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Require staging Firebase config
        run: |
          if grep -q REPLACE_WITH packages/firebase-config/src/index.ts; then
            echo "packages/firebase-config/src/index.ts still has REPLACE_WITH_* placeholders; fill in the staging web app config first." >&2
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter functions build
      - run: pnpm build:staging
      - name: Require App Check site key unless enforcement is off
        env:
          GCLOUD_PROJECT: sathiya-lk-staging
        run: node apps/app/deploy/check-app-check.mjs
      - name: Deploy to staging
        env:
          FIREBASE_SERVICE_ACCOUNT_STAGING: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STAGING }}
        run: |
          key="$RUNNER_TEMP/staging-sa.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_STAGING" > "$key"
          trap 'rm -f "$key"' EXIT
          chmod 600 "$key"
          export GOOGLE_APPLICATION_CREDENTIALS="$key"
          pnpm exec firebase deploy -P staging --only hosting,functions,firestore,storage --non-interactive
