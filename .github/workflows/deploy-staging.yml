name: Deploy staging
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 9
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Require staging Firebase config
        run: |
          if grep -q REPLACE_WITH packages/firebase-config/src/index.ts; then
            echo "packages/firebase-config/src/index.ts still has REPLACE_WITH_* placeholders; fill in the staging web app config first." >&2
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter functions build
      - run: pnpm build:staging
      - name: Require App Check site key unless enforcement is off
        env:
          GCLOUD_PROJECT: sathiya-lk-staging
        run: node apps/app/deploy/check-app-check.mjs
      - name: Deploy to staging
        env:
          FIREBASE_SERVICE_ACCOUNT_STAGING: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STAGING }}
        run: |
          key="$RUNNER_TEMP/staging-sa.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_STAGING" > "$key"
          trap 'rm -f "$key"' EXIT
          chmod 600 "$key"
          export GOOGLE_APPLICATION_CREDENTIALS="$key"
          pnpm exec firebase deploy -P staging --only hosting,functions,firestore,storage --non-interactive
