name: Bug report
description: Something in Sathiya doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Don't include passwords, real staff IDs or other personal data. Security issues go to SECURITY.md, not here.
  - type: dropdown
    id: area
    attributes:
      label: Where
      options:
        - App (admin)
        - App (teacher)
        - App (super admin)
        - Website
        - Print
        - Email
        - Local development / tests
        - Other
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What went wrong, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Sign in as admin
        2. Open Timetable → Class view
        3. ...
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: Language
      options:
        - English
        - Sinhala
        - Both
  - type: input
    id: env
    attributes:
      label: Browser and device
      placeholder: e.g. Chrome 131 on Android phone, Safari on iPad
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or logs
      description: Blur any personal data.
